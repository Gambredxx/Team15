<!DOCTYPE html>
<html>
<head>
    <title>Payment Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <div class="bg-white rounded-lg shadow-lg p-6 text-center">
            <div class="text-red-500 text-5xl mb-4">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h1 class="text-2xl font-bold mb-4">Payment Error</h1>
            <p class="mb-6 p-3 bg-red-100 text-red-800 rounded">{{ error_message }}</p>
            
            {% if member_id != 'N/A' %}
            <div class="bg-gray-100 p-4 rounded mb-6">
                <p class="font-mono">Member ID: {{ member_id }}</p>
            </div>
            {% endif %}
            
            <div class="flex justify-center space-x-4">
                <a href="/payment" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
                    Try Again
                </a>
                <a href="/" class="bg-gray-500 text-white px-6 py-2 rounded hover:bg-gray-600">
                    Return Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
